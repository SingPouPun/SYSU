services:
  - type: web
    name: sysu-immersive
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SYSU_SECRET_KEY
        generateValue: true
      - key: SYSU_SECURE_COOKIES
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: SYSU_BOOTSTRAP_ADMIN_USER
        sync: false
      - key: SYSU_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
